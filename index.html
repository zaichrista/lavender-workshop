<script>
/* =====================================================================
   LAVENDER WORKSHOP · SCENERY FOR A GAME
   ---------------------------------------------------------------------
   A flat, side-on "stage set", like a painted theatre backdrop:

     sky ▸ outdoors ▸ BACK (wall, floor, hanging lavender)
         ▸ MID (bed, table, chair, shelf, fireplace)
         ▸ [ your avatar goes here: Scene.drawAvatar ]
         ▸ FRONT (plants in the foreground)

   • Everything is painted with thousands of fine, curved strokes.
   • Every layer is painted 4 times with different stroke placement. The game
     flicks between those 4 paintings ~9 times a second, so the brushwork
     quietly "boils" like Loving Vincent. The shapes never move, only the paint.
   • The light (sky, tint, sunbeams, fire, lamp) changes with the hour.
   ===================================================================== */

const W = 1600, H = 700, SC = 1;
const FLOOR_TOP = 560;               // where the back wall meets the floor
const WALK_MIN_Y = 575, WALK_MAX_Y = 685;   // the strip an avatar can walk on
const GY = 600;                      // furniture stands on this line
const HZ = 372;                      // horizon seen through the openings
const WIN  = [130, 269, 330, 417];   // window opening [x0,y0,x1,y1]
const DOOR = [1410, 303, 1560, 560]; // doorway
const N = 4;
const CLOCK = [1240, 196, 46];   // analogue clock above the fireplace [x, y, radius]                         // brush variants

/* ---------- randomness: brush jitter varies per variant, layout never does ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry32(1), lr=mulberry32(5);
const R  = (a,b)=>a+(b-a)*rnd();       // brush randomness (changes between variants)
const LR = (a,b)=>a+(b-a)*lr();        // layout randomness (identical in every variant)
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const cj=(h,s,l,a=1,j=1)=>`hsla(${(h+R(-5,5)*j)|0},${clamp(s+R(-7,7)*j,0,100)|0}%,${clamp(l+R(-6,6)*j,0,100)|0}%,${a})`;

/* ---------- layers ---------- */
function makeLayer(x,y,w,h){ const c=document.createElement('canvas'); c.width=w*SC; c.height=h*SC; const g=c.getContext('2d'); g.scale(SC,SC); g.translate(-x,-y); g.lineCap='round'; return {c,g,ox:x,oy:y,w,h}; }
const OB_WIN=[100,250,360,440], OB_DOOR=[1380,280,1590,580], FB=[0,430,W,H-430];
const BACK=[],MID=[],FRONT=[],OUTW=[],OUTD=[],SKYW=[],SKYD=[],CURT=[],DOORL=[];
for(let v=0;v<N;v++){
  BACK.push(makeLayer(0,0,W,H)); MID.push(makeLayer(0,0,W,H)); FRONT.push(makeLayer(...FB));
  CURT.push(makeLayer(70,239,320,268)); DOORL.push(makeLayer(DOOR[0],DOOR[1],DOOR[2]-DOOR[0],DOOR[3]-DOOR[1]));
  OUTW.push(makeLayer(OB_WIN[0],OB_WIN[1],OB_WIN[2]-OB_WIN[0],OB_WIN[3]-OB_WIN[1]));
  OUTD.push(makeLayer(OB_DOOR[0],OB_DOOR[1],OB_DOOR[2]-OB_DOOR[0],OB_DOOR[3]-OB_DOOR[1]));
  SKYW.push(makeLayer(OB_WIN[0],OB_WIN[1],OB_WIN[2]-OB_WIN[0],HZ-OB_WIN[1]+4));
  SKYD.push(makeLayer(OB_DOOR[0],OB_DOOR[1],OB_DOOR[2]-OB_DOOR[0],HZ-OB_DOOR[1]+4));
}
const GRAIN=makeLayer(0,0,W,H), TMP=makeLayer(0,0,W,H);
TMP.g.setTransform(SC,0,0,SC,0,0);
const main=document.getElementById('main'); main.width=W*SC; main.height=H*SC;
const M=main.getContext('2d'); M.scale(SC,SC); M.lineCap='round';
let G=null, LB=[0,0,W,H];
const use=L=>{ G=L.g; LB=[L.ox,L.oy,L.ox+L.w,L.oy+L.h]; };

/* ---------- THE BRUSH ---------- */
function stk(x,y,len,w,ang,col,cv=0){
  const dx=Math.cos(ang)*len*.5, dy=Math.sin(ang)*len*.5;
  G.strokeStyle=col; G.lineWidth=w; G.beginPath(); G.moveTo(x-dx,y-dy);
  if (cv) G.quadraticCurveTo(x-dy*cv,y+dx*cv,x+dx,y+dy); else G.lineTo(x+dx,y+dy);
  G.stroke();
}
function inPoly(x,y,p){ let c=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const a=p[i],b=p[j]; if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c; } return c; }
const pathPoly=(g,pts)=>{ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); };
const rect=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const ellPts=(cx,cy,rx,ry,n=16)=>Array.from({length:n},(_,i)=>{const t=i/n*Math.PI*2;return[cx+Math.cos(t)*rx,cy+Math.sin(t)*ry];});

/* fill a shape with scattered strokes. col(x,y), ang(x,y) are functions */
function paintPoly(pts,col,ang,o={}){
  if (o.coarse) paintPoly(pts,col,ang,{len:[16,28],wid:[4,8],dens:1.7,aj:.4,cv:.22});     // loose underpainting first
  const len=o.len||[7,13], wid=o.wid||[1.5,2.8], dens=o.dens??2.9, cv=o.cv??.14, aj=o.aj??.28;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
  x0=Math.max(x0,LB[0]-4); y0=Math.max(y0,LB[1]-4); x1=Math.min(x1,LB[2]+4); y1=Math.min(y1,LB[3]+4);
  if (x1<=x0||y1<=y0) return;
  const avg=((len[0]+len[1])/2)*((wid[0]+wid[1])/2);
  const n=Math.min((x1-x0)*(y1-y0)*dens/avg,o.max||260000)|0;
  G.save(); pathPoly(G,pts); G.clip();
  for(let i=0;i<n;i++){ const x=R(x0,x1), y=R(y0,y1); if(!inPoly(x,y,pts)) continue;
    stk(x,y,R(len[0],len[1]),R(wid[0],wid[1]),ang(x,y)+R(-aj,aj),col(x,y,i),cv*R(-1,1)); }
  G.restore();
}
/* dark blue contour strokes along an edge (the Van Gogh outline) */
function edge(pts,[h,s,l]=[250,34,20],w=1.4,a=.5){
  for(let i=0;i<pts.length;i++){
    const A=pts[i],B=pts[(i+1)%pts.length], d=Math.hypot(B[0]-A[0],B[1]-A[1]); if(d<1) continue;
    const n=Math.max(1,Math.round(d/6)), ang=Math.atan2(B[1]-A[1],B[0]-A[0]);
    for(let k=0;k<n;k++){ const t=(k+.5)/n; stk(A[0]+(B[0]-A[0])*t+R(-.6,.6),A[1]+(B[1]-A[1])*t+R(-.6,.6),d/n*1.35,w*R(.7,1.3),ang+R(-.06,.06),cj(h,s,l,a,.6)); }
  }
}
const flat=()=>0, vert=()=>Math.PI/2;
function facePoly(pts,base,o={}){
  const [h,s,l]=base;
  paintPoly(pts,()=>cj(h,s,l,.97,o.j??.8),o.ang||flat,{len:o.len||[6,11],wid:o.wid||[1.4,2.5],dens:o.dens??3,aj:o.aj??.2,coarse:o.coarse});
  if (o.edge!==false) edge(pts,o.edgeCol||[250,34,20],o.ew||1.4,o.ea||.5);
}
const box=(x0,y0,x1,y1,base,o)=>facePoly(rect(x0,y0,x1,y1),base,o);

/* ---------- LAVENDER: a stem + a head of purple flecks ---------- */
const bez=(p0,c,p2,t)=>{const u=1-t;return{x:u*u*p0[0]+2*u*t*c[0]+t*t*p2[0],y:u*u*p0[1]+2*u*t*c[1]+t*t*p2[1],a:Math.atan2(2*u*(c[1]-p0[1])+2*t*(p2[1]-c[1]),2*u*(c[0]-p0[0])+2*t*(p2[0]-c[0]))};};
function lav(bx,by,tx,ty,hw,o={}){
  const L=Math.hypot(tx-bx,ty-by); if(L<3) return;
  const ang=Math.atan2(ty-by,tx-bx), bend=(o.bend??LR(-.13,.13))*L;
  const c=[(bx+tx)/2-Math.sin(ang)*bend,(by+ty)/2+Math.cos(ang)*bend], p0=[bx,by], p2=[tx,ty];
  const headF=o.head??.4, hue=o.hue??270, n=Math.max(5,Math.ceil(L/2));
  const e=bez(p0,c,p2,1-headF*.85);
  G.strokeStyle=cj(95,22,44,.95,.6); G.lineWidth=Math.max(.8,hw*.2);
  G.beginPath(); G.moveTo(bx,by); G.quadraticCurveTo(lerp(bx,c[0],1-headF*.85),lerp(by,c[1],1-headF*.85),e.x,e.y); G.stroke();
  const per=Math.max(2,Math.round(hw*.55));
  for(let i=0;i<=n;i++){
    const t=i/n; if(t<1-headF) continue;
    const k=(t-(1-headF))/headF, prof=.2+.8*Math.sin(Math.PI*Math.pow(k,.75)), p=bez(p0,c,p2,t), nx=-Math.sin(p.a), ny=Math.cos(p.a);
    for(let j=0;j<per;j++){ const off=R(-1,1)*hw*prof*.5;
      stk(p.x+nx*off,p.y+ny*off,hw*R(.5,.95),Math.max(1,hw*R(.2,.38)),p.a+R(-.9,.9),cj(hue+R(-10,12),R(40,64),R(40,70)+(Math.abs(off)<hw*.12?6:0),.9,.5),.3); }
    if(rnd()<.25) stk(p.x+nx*R(-hw,hw)*.4,p.y+ny*R(-hw,hw)*.4,hw*.5,hw*.25,R(0,6.3),cj(hue+14,45,82,.8),0);
  }
}
function bunch(bx,by,spread,len,count,hw,dir=1){
  for(let i=0;i<count;i++){ const u=count>1?i/(count-1)-.5:0;
    lav(bx+LR(-2,2)+u*spread*.12,by, bx+u*spread+LR(-spread*.12,spread*.12),by+dir*len*LR(.82,1.06),hw,{head:.45}); }
}
const tie=(x,y,w,h)=>box(x-w/2,y,x+w/2,y+h,[345,36,76],{edge:false,dens:3,len:[3,6],wid:[1,1.8]});

/* =====================================================================
   THE DAY: [hour, skyTop, skyMid, skyHorizon, roomTint, outsideTint, stars, lamp]
   ===================================================================== */
const KEYS=[
 [0 ,[10,14,48],[24,34,94],[52,70,128],[12,16,52,.62],[8,12,46,.55],1,1],
 [4.5,[18,22,64],[40,54,112],[84,92,140],[20,24,60,.55],[14,18,56,.45],.8,1],
 [6 ,[70,86,150],[200,150,170],[255,184,120],[70,50,100,.30],[255,170,140,.14],.15,.75],
 [7.5,[110,160,220],[190,205,235],[255,214,160],[255,200,160,.08],[255,210,170,.06],0,.2],
 [10,[70,140,225],[140,188,240],[214,226,246],[255,244,225,0],[255,255,255,0],0,0],
 [13,[60,130,220],[130,184,240],[220,232,248],[255,244,225,0],[255,255,255,0],0,0],
 [16.5,[86,130,206],[180,190,225],[250,214,170],[255,200,140,.10],[255,210,150,.08],0,.1],
 [18,[80,76,150],[226,120,120],[255,170,70],[255,150,100,.20],[255,150,100,.18],0,.4],
 [19,[44,42,110],[150,86,130],[250,130,90],[120,70,110,.34],[160,80,100,.30],.2,.8],
 [20.5,[20,24,76],[48,52,120],[110,86,140],[30,30,80,.5],[24,26,80,.45],.7,1],
 [22,[12,16,52],[28,38,100],[58,74,134],[14,18,54,.6],[10,14,50,.52],1,1],
 [24,[10,14,48],[24,34,94],[52,70,128],[12,16,52,.62],[8,12,46,.55],1,1],
];
const lerpv=(a,b,f)=>Array.isArray(a)?a.map((v,i)=>lerpv(v,b[i],f)):a+(b-a)*f;
function sampleDay(t){ let i=0; while(i<KEYS.length-2&&t>=KEYS[i+1][0]) i++; const a=KEYS[i],b=KEYS[i+1]; let f=(t-a[0])/(b[0]-a[0]); f=f*f*(3-2*f); const r=lerpv(a.slice(1),b.slice(1),f); return{top:r[0],mid:r[1],hor:r[2],room:r[3],out:r[4],stars:r[5],lamp:r[6]}; }
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* =====================================================================
   PAINTING THE SET (called once per variant, each with different brush randomness)
   ===================================================================== */
const holeRects=g=>{ for(const [x0,y0,x1,y1] of [WIN,DOOR]) g.rect(x0,y0,x1-x0,y1-y0); };
const wave=(x,y)=>Math.sin(x*.011+y*.017)*.5+Math.cos(y*.03)*.4;

function paintBack(v){
  use(BACK[v]);
  G.save(); G.beginPath(); G.rect(0,0,W,H); holeRects(G); G.clip('evenodd');

function scheduleFor(h){
  if(h<6.4||h>=22.5) return 'sleep';
  if(h<6.55) return 'curtain';      // wakes, opens the curtains
  if(h<6.7)  return 'doorShut';     // then opens the door
  if(h<7.6)  return 'door';

  return 'curtain';                 // ...then closes the curtains, then sleeps
}
const C={x:262,y:626,dir:1,mode:'idle',walkT:0,station:null,goal:{x:262,y:626},onBed:false,hop:null,petT:0,surprise:0,fid:3,sc:1,sx:1,sy:1,hopY:0,bw:100,bh:124};
const hearts=[];
const R2=(a,b)=>a+Math.random()*(b-a);
function pet(sec=3,more=false){
  if(C.onBed&&C.petT<=0) C.surprise=.9;
  C.petT=Math.max(C.petT,sec);
  for(let i=0;i<(more?10:5);i++) hearts.push({x:C.x+R2(-44,44),y:C.y-C.bh-6-R2(0,22),vy:R2(24,48),life:1,sz:more?R2(7,14):R2(6,10),ph:Math.random()*6});
}
function updateWorld(dt){
  const h=Scene.hour, gw=pendingGift()&&!overlayOpen, now=performance.now()/1000;
  { const sd=openTargets(h).door; if(lastSchedDoor===null) lastSchedDoor=sd; if(sd!==lastSchedDoor){ doorOverride=null; lastSchedDoor=sd; }
    const tg=effTargets(h); if(!Scene.openInit){ Scene.curt=tg.curt; Scene.door=tg.door; Scene.openInit=true; }      // on arrival the room is already as it should be
    for(const k of ['curt','door']){ const sp=(k==='door'&&doorOverride!==null)?dt/1.2:dt/6; Scene[k]+=clamp(tg[k]-Scene[k],-sp,sp); } }       // tapped doors swing in ~1 s, scheduled ones take ~6 s
  const grumpy=doorOverride===1&&openTargets(h).door===0;                                  // someone left the door open at night
  const want=overlayOpen?C.station||'table':(noteSave.queue.length?'letter':grumpy?'grump':(now<manualUntil?'manual':(sleepNow&&isNight(h)?'sleep':(gw?'gift':scheduleFor(h)))));
  if(!isNight(h)) sleepNow=false;
  C.noT=Math.max(0,(C.noT||0)-dt);
  C.grumpT=want==='grump'?7:Math.max(0,(C.grumpT||0)-dt);                                  // the little cloud lingers until he is back in bed
  for(const k of hearts){ k.y-=k.vy*dt; k.life-=dt*.55; } while(hearts.length&&hearts[0].life<=0) hearts.shift();
  C.hopY=0; C.sx=C.sy=1;
  if(C.hop){ C.hop.t+=dt/C.hop.dur; const t=Math.min(1,C.hop.t); C.x=lerp(C.hop.x0,C.hop.x1,t); C.y=lerp(C.hop.y0,C.hop.y1,t)-Math.sin(Math.PI*t)*60; C.mode='hop';
    if(t>=1){ C.hop=null; C.mode=C.onBed?'sleep':'idle'; } C.sc=1; return; }
  if(C.surprise>0){ C.surprise-=dt; C.mode='surprise'; return; }
  if(C.petT>0){ C.petT-=dt; C.mode=C.onBed?'sleepHappy':'happy'; if(!C.onBed){ C.hopY=-Math.abs(Math.sin(now*5))*4; } C.sx=1+.025*Math.sin(now*7); C.sy=1-.025*Math.sin(now*7); return; }
  if(C.station!==want){ C.station=want; C.goal={x:ST[want].x,y:ST[want].y};
    if(C.onBed){ C.hop={x0:C.x,y0:C.y,x1:C.x,y1:626,t:0,dur:1.4}; C.onBed=false; return; } }
  const dx=C.goal.x-C.x, dy=C.goal.y-C.y, d=Math.hypot(dx,dy);
  if(!C.onBed&&d>3){ const sp=85, k=Math.min(1,sp*dt/d); C.x+=dx*k; C.y+=dy*k; if(Math.abs(dx)>2) C.dir=dx>0?1:-1; C.mode='walk'; C.walkT+=dt*5; }
  else { const s=ST[C.station]; C.dir=s.dir; C.mode=s.mode;
    if(C.station==='manual'&&!manualArrived){ manualArrived=true; manualUntil=now+5; }      // 5 s after he gets there, with no new orders, he carries on with his day (or goes to bed)
    if(C.station==='grump'&&doorOverride===1) doorOverride=null;                         // he has reached it: now it swings shut
    if(s.act&&Math.abs(effTargets(h)[s.act]-Scene[s.act])>.002) C.mode='pickup';       // reaching up while it moves
    if(C.mode==='excited') C.hopY=-Math.abs(Math.sin(now*7))*9;
    if(C.station==='sleep'&&!C.onBed){ C.hop={x0:C.x,y0:C.y,x1:C.x,y1:BED_Y,t:0,dur:1.5}; C.onBed=true; }
    else if(s.fid){ C.fid-=dt; if(C.fid<=0){ C.fid=R2(5,9); C.goal={x:clamp(s.x+R2(-55,55),60,1520),y:clamp(s.y+R2(-8,8),580,684)}; } } }
  C.sc=C.onBed?1:lerp(.82,1.12,clamp((C.y-575)/110,0,1));
}

/* ---------- picking the frame ---------- */
const IDLE_SEQ=[0,0,2,0,3,0,0,1];                                   // frame 1 is the blink
function crocPick(t){
  if(!CF) return null;
  let key='idle', idx=0, flip=C.dir<0;
  switch(C.mode){
    case 'walk': key=C.dir>0?'walkR':'walkL'; idx=Math.floor(C.walkT)%4; flip=false; break;
    case 'work': key=['cut','tie','sort'][Math.floor(Scene.hour)%3]; idx=Math.floor(t*2.6)%4; break;
    case 'sort': key='sort'; idx=Math.floor(t*2.4)%4; break;
    case 'sit': key='sit'; idx=[0,1,2,1][Math.floor(t*1.2)%4]; break;
    case 'sleep': case 'sleepHappy': key='sleep'; idx=Math.floor(t*1.3)%4; break;
    case 'happy': case 'hop': key='happy'; idx=Math.floor(t*3.5)%4; break;
    case 'excited': key='talk'; idx=Math.floor(t*5)%4; break;
    case 'pickup': key='pickup'; idx=Math.floor(t*1.6)%4; break;
    case 'surprise': key='hurt'; idx=1; break;
    default: idx=IDLE_SEQ[Math.floor(t*2.4)%IDLE_SEQ.length];
  }
  const arr=CF[key]; if(!arr||!arr.length) return null;
  return {fr:arr[idx%arr.length],flip};
}

function tintedCanvas(cv,w,h,c){
  if(c[3]<.01) return cv;
  const t=TMP.g; t.save(); t.setTransform(SC,0,0,SC,0,0); t.globalCompositeOperation='source-over'; t.clearRect(0,0,w,h); t.drawImage(cv,0,0);
  t.globalCompositeOperation='source-atop'; t.fillStyle=rgba(c,c[3]); t.fillRect(0,0,w,h); t.restore(); return TMP.c;
}
function tintedSprite(L,c){ return tintedCanvas(L.c,L.w,L.h,c); }
function heart(g,x,y,s,a){ g.save(); g.translate(x,y); g.scale(s,s); g.beginPath(); g.moveTo(0,.9); g.bezierCurveTo(-1.2,.1,-.7,-.9,0,-.35); g.bezierCurveTo(.7,-.9,1.2,.1,0,.9);
  g.fillStyle=`rgba(255,126,166,${a})`; g.fill(); g.lineWidth=.16; g.strokeStyle=`rgba(170,50,100,${a*.7})`; g.stroke(); g.restore(); }
let boxStep=-1;
function drawCharacters(g,hour,t,S){
  const step=avail>=2?fireStep:Math.floor(t*9);
  if(step!==boxStep){ boxStep=step; withBrush(BOX_L,step*104729+11,()=>drawBox()); }
  // gift box on the table
  if(pendingGift()&&!overlayOpen){
    const by=BOX.y-1.5-Math.sin(t*2.6)*1.6;
    g.save(); g.translate(BOX.x,by); g.drawImage(tintedSprite(BOX_L,S.room),0,0,BOX_L.w,BOX_L.h,BOX_L.ox,BOX_L.oy,BOX_L.w,BOX_L.h); g.restore();
    g.save(); g.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){ const a=.5+.5*Math.sin(t*3+i*1.9), x=BOX.x+Math.cos(i*1.05+t*.4)*(30+i*4), y=by-34+Math.sin(i*1.37+t*.5)*((30+i*4)*.7); g.strokeStyle=`rgba(255,236,170,${a*.9})`; g.lineWidth=1.6;
      g.beginPath(); g.moveTo(x-5*a,y); g.lineTo(x+5*a,y); g.moveTo(x,y-5*a); g.lineTo(x,y+5*a); g.stroke(); }
    g.restore();
  }
  // the love-note envelope on the bookshelf
  if(noteSave.queue.length){
    const age=clamp((performance.now()/1000-ENV.t0)/1.1,0,1), pop=age<1?1+Math.sin(age*Math.PI)*.35*(1-age)+(age-1)*0:1, sc=ease(age)*pop, op=clamp(NOTE.t/2.2,0,1);
    g.save(); g.translate(ENV.x,ENV.y+Math.sin(t*2)*1.5); g.rotate(-.1); g.scale(sc,sc);
    g.save(); g.globalCompositeOperation='lighter'; const gr=g.createRadialGradient(0,0,2,0,0,40); gr.addColorStop(0,'rgba(255,214,228,.38)'); gr.addColorStop(1,'rgba(255,214,228,0)'); g.fillStyle=gr; g.fillRect(-42,-42,84,84); g.restore();
    g.fillStyle='#fffdf6'; g.strokeStyle='#b88a98'; g.lineWidth=1; g.fillRect(-13,-9-op*15,26,18); g.strokeRect(-13,-9-op*15,26,18);        // the letter slides out
    g.fillStyle='#f6ead8'; g.strokeStyle='#8a5a6a'; g.lineWidth=1.4; g.fillRect(-18,-10,36,22); g.strokeRect(-18,-10,36,22);
    g.beginPath(); g.moveTo(-18,12); g.lineTo(0,0); g.lineTo(18,12); g.stroke();
    g.fillStyle='#ecb8c6'; g.beginPath(); g.moveTo(-18,-10); g.lineTo(18,-10); g.lineTo(0,lerp(3,-24,ease(op))); g.closePath(); g.fill(); g.stroke();
    if(op<.4) heart(g,0,2.5,4.6,1-op*2.5);
    g.restore();
    g.save(); g.globalCompositeOperation='lighter'; g.strokeStyle='rgba(255,236,190,.85)'; g.lineWidth=1.2;
    for(let i=0;i<3;i++){ const a=.5+.5*Math.sin(t*2.4+i*2.1), x=ENV.x+Math.cos(i*2.1+t*.5)*30, y=ENV.y+Math.sin(i*2.1+t*.5)*18, z=4*a; g.beginPath(); g.moveTo(x-z,y); g.lineTo(x+z,y); g.moveTo(x,y-z); g.lineTo(x,y+z); g.stroke(); }
    g.restore();
  }
  // soft rings where you tapped
  for(const r of ripples){ const a=clamp(r.life,0,1), rr=(1-a)*30+5; g.strokeStyle=`rgba(255,240,255,${a*.6})`; g.lineWidth=1.5; g.beginPath(); g.ellipse(r.x,r.y,rr,rr*.3,0,0,6.3); g.stroke(); }
  // a soft rosy glow around the letter box
  { g.save(); g.globalCompositeOperation='lighter'; const gr=g.createRadialGradient(1057,358,4,1057,358,58), a=.26+.1*Math.sin(t*1.6); gr.addColorStop(0,`rgba(255,196,214,${a})`); gr.addColorStop(1,'rgba(255,196,214,0)'); g.fillStyle=gr; g.fillRect(990,298,134,120); g.restore(); }
  // the secret jar and the letter box each twinkle now and then (out of step with each other)
  for(const [sx,sy,ph] of [[1247,410,0],[1082,342,2.4]]){ const tw=Math.pow(Math.max(0,Math.sin(t*.5+ph)),16); if(tw>.03){ g.save(); g.globalCompositeOperation='lighter'; g.strokeStyle=`rgba(255,240,190,${tw*.9})`; g.lineWidth=1.3; const z=7*tw;
    g.beginPath(); g.moveTo(sx-z,sy); g.lineTo(sx+z,sy); g.moveTo(sx,sy-z); g.lineTo(sx,sy+z); g.stroke(); g.restore(); } }
  // the crocodile
  const p=crocPick(t); if(!p) return;
  const fr=p.fr, s=CS*C.sc;
  if(!C.onBed&&!C.hop){ g.fillStyle='rgba(30,18,50,.2)'; g.beginPath(); g.ellipse(C.x,C.y+2,Math.max(40,fr.bodyW*.42)*s,7*s,0,0,6.3); g.fill(); }
  g.save(); g.translate(C.x,C.y+C.hopY);
  if(C.noT>0){ g.translate(0,-C.bh*.6); g.rotate(Math.sin(t*16)*.14*Math.min(1,C.noT)); g.translate(0,C.bh*.6); }      // shaking his head
  g.scale((p.flip?-1:1)*s*C.sx,s*C.sy);
  g.drawImage(tintedCanvas(fr.cv,fr.w,fr.h,S.room),0,0,fr.w,fr.h,-fr.ax,-fr.ay,fr.w,fr.h); g.restore();
  C.bw=fr.bodyW*s; C.bh=fr.bodyH*s;
  if(C.noT>0){ const a=Math.min(1,C.noT*1.5), bx=C.x+C.bw*.3, by=C.y-C.bh-16;
    g.save(); g.globalAlpha=a; g.fillStyle='rgba(255,250,244,.95)'; g.strokeStyle='rgba(70,50,90,.7)'; g.lineWidth=1.4; g.beginPath(); g.ellipse(bx,by,19,11,0,0,6.3); g.fill(); g.stroke();
    g.fillStyle='rgba(70,50,90,.9)'; g.font='bold 13px ui-monospace,Menlo,monospace'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('no',bx,by+1); g.restore(); }
  if((C.grumpT||0)>0){                                                             // a little grumpy cloud
    const a=Math.min(1,C.grumpT), cx=C.x, cy=C.y-C.bh-28+Math.sin(t*2)*2;
    g.save(); g.globalAlpha=a; g.fillStyle='rgba(88,84,108,.96)';
    for(const [dx,dy,r] of [[-14,2,9],[-4,-5,11],[8,-3,10],[17,3,8],[1,4,10]]){ g.beginPath(); g.arc(cx+dx,cy+dy,r,0,6.3); g.fill(); }
    g.fillStyle='rgba(58,54,78,.55)'; g.beginPath(); g.ellipse(cx,cy+9,22,4,0,0,6.3); g.fill();
    g.strokeStyle='rgba(170,200,255,.85)'; g.lineWidth=1.3; g.lineCap='round';
    for(let i=0;i<3;i++){ const ph=(t*1.6+i*.33)%1; g.beginPath(); g.moveTo(cx-10+i*10,cy+13+ph*20); g.lineTo(cx-11+i*10,cy+18+ph*20); g.stroke(); }
    if(Math.sin(t*5)>.55){ g.strokeStyle='rgba(255,226,110,.95)'; g.lineWidth=1.8; g.beginPath(); g.moveTo(cx+5,cy+10); g.lineTo(cx+1,cy+17); g.lineTo(cx+6,cy+17); g.lineTo(cx+2,cy+25); g.stroke(); }
    g.restore(); }
  if(T.state==='fly'){ g.save(); g.translate(T.x,T.y); g.rotate(T.t*9); g.fillStyle='hsl(32,62,64)'; g.strokeStyle='hsl(24,50,32)'; g.lineWidth=1.3; g.beginPath(); g.arc(0,0,6.5,0,6.3); g.fill(); g.stroke();
    g.fillStyle='hsl(20,48,30)'; for(const [dx,dy] of [[-2.5,-1.5],[2,-2.5],[0,2.5]]){ g.beginPath(); g.arc(dx,dy,1,0,6.3); g.fill(); } g.restore(); }
  for(const k of hearts) heart(g,k.x+Math.sin(t*3+k.ph)*6,k.y,k.sz,clamp(k.life,0,1));
}

/* ---------- touch / mouse ---------- */
function toLogical(e){ const r=main.getBoundingClientRect(), s=Math.max(r.width/W,r.height/H), ox=r.left+(r.width-W*s)/2, oy=r.top+(r.height-H*s)/2; return [(e.clientX-ox)/s,(e.clientY-oy)/s]; }
const hitBox=([x,y])=>pendingGift()&&!overlayOpen&&Math.abs(x-BOX.x)<36&&y>BOX.y-80&&y<BOX.y+6;
const hitCroc=([x,y])=>Math.pow((x-C.x)/(C.bw*.6),2)+Math.pow((y-(C.y-C.bh*.5))/(C.bh*.6),2)<=1;
/* ---------- love: every pet fills the bar; it never ends, it just starts another level ---------- */
let love={lv:1,pts:0}; try{ const s=JSON.parse(localStorage.getItem('croc_love')||'null'); if(s&&s.lv) love=s; }catch(e){}
const need=lv=>Math.round(30*Math.pow(1.3,lv-1)), loveFill=document.querySelector('#loveBar i'), loveLv=document.getElementById('loveLv'), loveEl=document.getElementById('love');
function loveRender(){ loveFill.style.transform='scaleX('+Math.min(1,love.pts/need(love.lv))+')'; loveLv.textContent='love · '+love.lv; }
function loveAdd(n){
  love.pts+=n;
  while(love.pts>=need(love.lv)){ love.pts-=need(love.lv); love.lv++; loveEl.classList.remove('pulse'); void loveEl.offsetWidth; loveEl.classList.add('pulse'); pet(5,true); queueNote(love.lv); }
  try{ localStorage.setItem('croc_love',JSON.stringify(love)); }catch(e){}
  loveRender();
}
loveRender();

/* ---------- love notes: a letter appears on the bookshelf at each new level, and croc drops everything to go and open it ---------- */
let noteSave={queue:[],read:[]}; try{ const s=JSON.parse(localStorage.getItem('croc_notes')||'null'); if(s&&s.queue&&s.read) noteSave=s; }catch(e){}
const saveNotes=()=>{ try{ localStorage.setItem('croc_notes',JSON.stringify(noteSave)); }catch(e){} };
const ENV={x:1020,y:452,t0:0}, NOTE={t:0};
function queueNote(lv){
  if(!window.LOVE_NOTES||!LOVE_NOTES[lv]||noteSave.read.includes(lv)||noteSave.queue.includes(lv)) return;
  noteSave.queue.push(lv); saveNotes(); ENV.t0=performance.now()/1000; showNotice('a love note has arrived ✉  on the bookshelf');
}
for(let lv=2;lv<=love.lv;lv++) queueNote(lv);
const noteEl=document.getElementById('note');
function openNote(){
  const lv=noteSave.queue[0]; if(!lv) return;
  overlayOpen=true; openedAt=Date.now(); NOTE.t=3;
  document.getElementById('noteHead').textContent='love note · level '+lv; document.getElementById('noteBody').textContent=LOVE_NOTES[lv]; noteEl.classList.add('show');
}
document.getElementById('noteClose').onclick=()=>{
  if(Date.now()-openedAt<500) return;
  noteEl.classList.remove('show'); overlayOpen=false; const lv=noteSave.queue.shift(); if(lv) noteSave.read.push(lv); saveNotes(); NOTE.t=0; pet(5,true);
};
function updateNote(dt){
  if(!noteSave.queue.length||overlayOpen) return;
  const here=C.station==='letter'&&!C.hop&&!C.onBed&&Math.hypot(C.goal.x-C.x,C.goal.y-C.y)<4;
  if(here){ NOTE.t+=dt; if(NOTE.t>2.8) openNote(); } else NOTE.t=0;
}

/* ---------- the letter box on the bookshelf: every note he has opened, level by level ---------- */
const hitLetters=([x,y])=>x>1022&&x<1092&&y>332&&y<386;
const lettersEl=document.getElementById('letters'), lettersList=document.getElementById('lettersList');
function openLetters(){
  const got=Object.keys(LOVE_NOTES).map(Number).filter(lv=>noteSave.read.includes(lv)).sort((a,b)=>a-b);
  lettersList.innerHTML=got.length?'':'<div class="empty">no letters yet. keep loving croc ♡</div>';
  for(const lv of got){ const d=document.createElement('div'); d.className='ln'; d.innerHTML='<div class="lv">level '+lv+'</div><div class="tx"></div>'; d.querySelector('.tx').textContent=LOVE_NOTES[lv]; lettersList.appendChild(d); }
  document.getElementById('lettersHead').textContent='letter box · '+got.length+' of '+Object.keys(LOVE_NOTES).length;
  overlayOpen=true; openedAt=Date.now(); lettersEl.classList.add('show');
}
function closeLetters(){ if(Date.now()-openedAt<400) return; lettersEl.classList.remove('show'); overlayOpen=false; }
document.getElementById('lettersClose').onclick=closeLetters;
lettersEl.addEventListener('click',e=>{ if(e.target===lettersEl) closeLetters(); });

/* ---------- tap to send him somewhere ---------- */
let manualUntil=0; const ripples=[];
function walkTo(x,y){
  if(noteSave.queue.length) return;                                    // a letter is waiting: nothing else matters to him right now
  x=clamp(x,60,1520); y=clamp(y,WALK_MIN_Y,WALK_MAX_Y);
  ST.manual={x,y,dir:(x<C.x?-1:1),mode:'idle'}; manualUntil=performance.now()/1000+60; manualArrived=false; sleepNow=false;      // the 5 s countdown starts when he arrives
  if(C.station==='manual') C.goal={x,y};
  ripples.push({x,y,life:1});
}

/* ---------- the secret jar ---------- */
const JAR={x:1236,y:436}, hitJar=([x,y])=>x>1216&&x<1256&&y>392&&y<440;
const hitBed=([x,y])=>x>36&&x<398&&y>428&&y<598;
function tapBed(){
  if(isNight(Scene.hour)){ if(C.onBed||C.station==='sleep') return; sleepNow=true; manualUntil=0; T.state=''; }      // night: off to bed
  else C.noT=1.5;                                                                                                    // daytime: shakes his head, "no"
}
const hitDoor=([x,y])=>x>DOOR[0]-14&&x<DOOR[2]+14&&y>DOOR[1]-14&&y<DOOR[3]+8;
function toggleDoor(){ const h=Scene.hour, want=effTargets(h).door?0:1; doorOverride=(want===openTargets(h).door)?null:want; }
const T={state:'',t:0,x:0,y:0};
function giveTreat(){
  if(T.state) return;
  T.state='walk'; walkTo(JAR.x+(C.x<JAR.x?-8:8),646);
}
function updateTreat(dt){
  for(const r of ripples) r.life-=dt*.9; while(ripples.length&&ripples[0].life<=0) ripples.shift();
  if(T.state==='walk'){
    if(C.station!=='manual'||performance.now()/1000>manualUntil){ T.state=''; return; }
    if(!C.hop&&!C.onBed&&Math.hypot(C.goal.x-C.x,C.goal.y-C.y)<4){ T.state='fly'; T.t=0; C.dir=1; }
  } else if(T.state==='fly'){
    T.t+=dt/.95; const k=Math.min(1,T.t), tx=C.x+C.dir*16, ty=C.y-C.bh*.72;
    T.x=lerp(JAR.x,tx,k); T.y=lerp(JAR.y-26,ty,k)-Math.sin(Math.PI*k)*46;
    if(k>=1){ T.state=''; pet(5,true); loveAdd(10); for(let i=0;i<8;i++) hearts.push({x:C.x+R2(-30,30),y:C.y-C.bh*.6,vy:R2(30,60),life:1,sz:R2(6,12),ph:Math.random()*6}); }
  }
}

/* ---------- touch / mouse ---------- */
let downAt=null, lastStroke=0;
main.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });
main.addEventListener('click',e=>{
  if(overlayOpen) return;
  if(downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>14) return;       // that was a stroke, not a tap
  const p=toLogical(e);
  if(hitBox(p)){ openGift(pendingGift()); return; }
  if(hitJar(p)){ giveTreat(); return; }
  if(hitLetters(p)){ openLetters(); return; }
  if(hitCroc(p)){ pet(3.2,true); loveAdd(3); return; }
  if(hitBed(p)){ tapBed(); return; }
  if(hitDoor(p)){ toggleDoor(); return; }
  T.state=''; walkTo(p[0],p[1]);
});
main.addEventListener('pointermove',e=>{
  const p=toLogical(e); main.style.cursor=(hitBox(p)||hitCroc(p)||hitJar(p)||hitDoor(p)||hitBed(p)||hitLetters(p))?'pointer':'default';
  if(e.buttons&&!overlayOpen&&hitCroc(p)&&performance.now()-lastStroke>380){ lastStroke=performance.now(); pet(2.2,true); loveAdd(1); }   // stroke him
});
if(pendingGift()) setTimeout(()=>showNotice('A gift has arrived 🎁  look on the table'),2500);

/* ---------- the analogue clock above the fireplace (face is painted; hands move with real time) ---------- */
function drawClockHands(g,hour,t,S){
  const [cx,cy,cr]=CLOCK, sec=(hour*3600)%60, min=(hour*60)%60, hr=hour%12;
  const aS=sec/60*Math.PI*2-Math.PI/2, aM=min/60*Math.PI*2-Math.PI/2, aH=hr/12*Math.PI*2-Math.PI/2;
  const jit=(fireStep%3-1)*.35;                                      // hands shiver slightly with the brushwork
  const hand=(a,len,w,col)=>{ g.strokeStyle=col; g.lineWidth=w; g.lineCap='round'; g.beginPath(); g.moveTo(cx-Math.cos(a)*5,cy-Math.sin(a)*5); g.lineTo(cx+Math.cos(a)*len+jit,cy+Math.sin(a)*len+jit*.6); g.stroke(); };
  const dim=1-S.room[3]*.5;
  hand(aH,cr*.5,3.2,`hsla(255,35,${22*dim},.95)`); hand(aM,cr*.76,2.4,`hsla(255,35,${22*dim},.95)`); hand(aS,cr*.82,1,'hsla(345,60,42,.9)');
  g.fillStyle='hsla(345,60,42,.95)'; g.beginPath(); g.arc(cx,cy,2.4,0,6.3); g.fill();
}


const Scene={ W,H,floorTop:FLOOR_TOP,walkMinY:WALK_MIN_Y,walkMaxY:WALK_MAX_Y,groundY:GY,
  hour:7,live:true,playing:false,dayLength:120,drawAvatar:drawCharacters,
  setHour(h){ Scene.hour=h; },
  doorX:(DOOR[0]+DOOR[2])/2, windowX:(WIN[0]+WIN[2])/2 };
window.Scene=Scene;
Scene.curt=1; Scene.door=1; Scene.openInit=false;      // 1 = open, 0 = closed

function render(ts){
  if (avail<1) return;
  stepBoil(ts); const t=ts/1000, hour=Scene.hour;
  const S=sampleDay(hour), sm=sunMoon(hour), n=avail;
  const vB=cur%n, vM=(cur+1)%n, vO=(cur+2)%n, vF=(cur+3)%n;
  M.globalCompositeOperation='source-over';
  drawSkyBodies(S,t,sm,vM);
  tint(OUTW[vO],S.out); tint(OUTD[vO],S.out);
  tint(BACK[vB],S.room,off[0],off[1]);
  drawCurtains(S,vB); drawDoor(S,vB);
  const {sunI}=drawLightsBehind(S,t,sm);
  drawGiftFrames(S);                                                  // paintings you've been given, hanging on the wall
  tint(MID[vM],S.room,-off[0],off[1]);
  drawClockHands(M,hour,t,S);
  Scene.drawAvatar(M,hour,t,S);                                      // the crocodile (+ gift box), between furniture and foreground
  drawLightsFront(S,t,sm,sunI);
  tint(FRONT[vF],S.room,off[0],-off[1]);
  M.drawImage(GRAIN.c,0,0,W,H);
}

/* =====================================================================
   CLOCK + CONTROLS
   ===================================================================== */
const slider=document.getElementById('slider'), clock=document.getElementById('clock'), phase=document.getElementById('phase'), playBtn=document.getElementById('play');
const phaseName=h=>h<5?'Deep night':h<6.6?'Dawn':h<11?'Morning':h<15?'Midday':h<17.5?'Afternoon':h<19.5?'Golden hour':h<21?'Dusk':'Night';
function hud(){ const h=Scene.hour, hh=Math.floor(h), mm=Math.floor((h-hh)*60); clock.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'); phase.textContent=phaseName(h); }
slider.oninput=()=>{ Scene.hour=parseFloat(slider.value); Scene.live=false; Scene.playing=false; playBtn.textContent='▶'; };
playBtn.onclick=()=>{ Scene.playing=!Scene.playing; playBtn.textContent=Scene.playing?'❚❚':'▶'; };
let last=performance.now();
function frame(ts){
  const dt=Math.min(.1,(ts-last)/1000); last=ts;
  if (Scene.live){ const d=new Date(); Scene.hour=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600+d.getMilliseconds()/3.6e6; }   // the day follows the real day
  else if (Scene.playing){ Scene.hour=(Scene.hour+dt*24/Scene.dayLength)%24; slider.value=Scene.hour; }
  updateWorld(dt); updateTreat(dt); updateNote(dt); hud(); render(ts);
  requestAnimationFrame(frame);
}
if(location.hash==='#debug'){ document.body.classList.add('debug'); Scene.live=false; Scene.playing=true; playBtn.textContent='❚❚'; }   // open game.html#debug to scrub time
requestAnimationFrame(frame);
paintAll();
window.__setHour=h=>{Scene.live=false;Scene.hour=h;slider.value=h;Scene.playing=false;playBtn.textContent='▶';};
</script>
