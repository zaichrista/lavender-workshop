<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Croc's Workshop</title>
<script src="assets/menu.js"></script>
<style>
  html,body { margin:0; height:100%; background:#c6e2cb; overflow:hidden; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  #bg { position:fixed; inset:0; width:100%; height:100%; opacity:0; transition:opacity 2.2s ease; }
  #bg.on { opacity:1; }
  main { position:relative; min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; text-align:center; padding:0 20px; box-sizing:border-box; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  #title { display:block; animation:rise 2s ease .3s backwards; }
  .enter { display:block; line-height:0; transition:transform .9s ease,filter .9s ease; animation:rise 1.6s ease 1s backwards; }
  .enter:hover { transform:translateY(-2px); filter:brightness(1.18) saturate(1.1); }
  #croc { width:min(360px,86vw); height:250px; display:block; animation:rise 1.6s ease 1.8s backwards; }
</style>
</head>
<body>
<h1 class="sr">Croc's workshop</h1>
<canvas id="bg"></canvas>
<main>
  <canvas id="title"></canvas>
  <a class="enter" href="index.html" aria-label="enter"><canvas id="btn"></canvas></a>
  <canvas id="croc"></canvas>
</main>
<script src="assets/paint.js"></script>
<script src="assets/croc-sheet.js"></script>
<script src="assets/croc-slicer.js?v=4"></script>
<script>
const MONO='ui-monospace,Menlo,Consolas,"Courier New",monospace', NV=4;
const dpr=Math.min(devicePixelRatio||1,2), blank=(w,h,r)=>{ const c=document.createElement('canvas'); c.width=Math.round(w*r); c.height=Math.round(h*r); return c; };

/* ---------- the writing + the button, painted in several versions like everything else ---------- */
const title=document.getElementById('title'), btn=document.getElementById('btn');
const fs=Math.round(Math.max(24,Math.min(38,innerWidth*.034))), sp=fs*.2, TEXT="Croc's workshop";
const probe=document.createElement('canvas').getContext('2d'); probe.font=`600 ${fs}px ${MONO}`;
const tw=Math.ceil(probe.measureText(TEXT).width+TEXT.length*sp)+40, th=Math.round(fs*2.4);
const bw=180, bh=58, INK=[145,30,16];
for(const [c,w,h] of [[title,tw,th],[btn,bw,bh]]){ c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); c.style.width=w+'px'; c.style.height=h+'px'; }
const titleFrames=[], btnFrames=[], bgFrames=[];
(async function(){
  for(let v=0;v<NV;v++){
    const t=blank(tw,th,dpr), tg=t.getContext('2d'); tg.scale(dpr,dpr);
    await VG.field(tg,[8,th*.16,tw-8,th*.84],()=>VG.hsl(100+Math.random()*20,40,92+Math.random()*6,.7),()=>-.1,{rnd:Math.random,len:[8,16],wid:[3,6],dens:2.6,aj:.3});
    VG.paintedText(tg,TEXT,tw/2,th/2,{r:dpr,size:fs,spacing:sp,seed:11+v*53,hsl:INK,dens:6,weight:600,under:'rgba(22,48,32,.88)'});
    const b=blank(bw,bh,dpr), bg2=b.getContext('2d'); bg2.scale(dpr,dpr);
    await VG.handBox(bg2,4,4,bw-4,bh-4,91+v*31,{hsl:INK});
    VG.paintedText(bg2,'enter',bw/2,bh/2+1,{r:dpr,size:18,spacing:5,seed:5+v*17,hsl:INK,dens:6,weight:600,under:'rgba(22,48,32,.9)'});
    titleFrames.push(t); btnFrames.push(b);
  }
})();

/* ---------- the van gogh backdrop ---------- */
(async function(){
  const bg=document.getElementById('bg'), r=1;
  const W=bg.width=Math.min(1280,Math.round(innerWidth*r)), H=bg.height=Math.round(W*innerHeight/innerWidth);
  for(let i=0;i<NV;i++){ const c=document.createElement('canvas'); c.width=W; c.height=H; await VG.swirl(c.getContext('2d'),W,H,31+i*977); bgFrames.push(c); if(!i) bg.classList.add('on'); }
})();
VG.flicker([{cv:document.getElementById('bg'),frames:bgFrames},{cv:title,frames:titleFrames,still:true},{cv:btn,frames:btnFrames,still:true}],true);

/* ---------- croc, feeling things ---------- */
const cv=document.getElementById('croc'), g=cv.getContext('2d');
cv.width=(cv.clientWidth||360)*dpr; cv.height=250*dpr;
const EMOTES=[
  {key:'idle',  seq:[0,0,2,0,3,0,0,1], rate:1.6, sym:'',      dur:4},
  {key:'happy', rate:3,   sym:'hearts', dur:6},
  {key:'talk',  rate:3,   sym:'♪',     dur:5},
  {key:'sit',   seq:[0,1,2,1], rate:.9, sym:'…',  dur:6},
  {key:'hurt',  seq:[1],  rate:1, sym:'!',          dur:2.6},
  {key:'happy', rate:3,   sym:'hearts', dur:5},
  {key:'sleep', rate:1.1, sym:'z z z', dur:7},
];
const hearts=[], R2=(a,b)=>a+Math.random()*(b-a);
function heart(x,y,s,a){ g.save(); g.translate(x,y); g.scale(s,s); g.beginPath(); g.moveTo(0,.9); g.bezierCurveTo(-1.2,.1,-.7,-.9,0,-.35); g.bezierCurveTo(.7,-.9,1.2,.1,0,.9);
  g.fillStyle=`rgba(255,126,166,${a})`; g.fill(); g.lineWidth=.16; g.strokeStyle=`rgba(170,50,100,${a*.7})`; g.stroke(); g.restore(); }
sliceCrocSheet(window.CROC_SHEET).then(F=>{
  let ei=0, t0=performance.now()/1000, symT=0, last=t0;
  const cw=cv.width/dpr, ch=cv.height/dpr, s=150/F.__standH, gx=cw/2, gy=ch-26;
  (function loop(){
    const now=performance.now()/1000, dt=Math.min(.1,now-last); last=now;
    let e=EMOTES[ei]; if(now-t0>e.dur){ ei=(ei+1)%EMOTES.length; e=EMOTES[ei]; t0=now; symT=0; }
    const et=now-t0; symT+=dt;
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,cw,ch);
    const arr=F[e.key]||F.idle, i=e.seq?e.seq[Math.floor(et*e.rate)%e.seq.length]:Math.floor(et*e.rate);
    const fr=arr[i%arr.length], bob=e.key==='happy'?-Math.abs(Math.sin(now*2.2))*7:Math.sin(now*1.1)*1.2;
    g.fillStyle='rgba(31,53,38,.16)'; g.beginPath(); g.ellipse(gx,gy+2,fr.bodyW*.42*s,7,0,0,6.3); g.fill();
    g.drawImage(fr.cv,gx-fr.ax*s,gy+bob-fr.ay*s,fr.w*s,fr.h*s);
    if(e.sym==='hearts'){ if(Math.random()<dt*1.4) hearts.push({x:gx+R2(-40,40),y:gy-fr.bodyH*s-4,vy:R2(14,24),life:1,sz:R2(6,10),ph:Math.random()*6}); }
    else if(e.sym){ const k=Math.min(1,et/1.2)*Math.min(1,(e.dur-et)/1.2), rise=Math.min(et,4)*5;
      g.font='500 22px ui-monospace,Menlo,monospace'; g.textAlign='center'; g.fillStyle=`rgba(31,53,38,${.7*k})`; g.fillText(e.sym,gx+fr.bodyW*s*.3,gy-fr.bodyH*s-8-rise); }
    for(const k of hearts){ k.y-=k.vy*dt; k.life-=dt*.3; heart(k.x+Math.sin(now*1.5+k.ph)*6,k.y,k.sz,Math.max(0,Math.min(1,k.life))); }
    while(hearts.length&&hearts[0].life<=0) hearts.shift();
    requestAnimationFrame(loop);
  })();
}).catch(e=>console.error(e));
</script>
</body>
</html>
